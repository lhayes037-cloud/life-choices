name: Build Android app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor shell that loads the live game
        run: |
          mkdir shell && cd shell
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/speech-recognition@6 >/dev/null
          mkdir www
          echo '<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><body style="font-family:sans-serif;padding:24px"><h2>Life Choices</h2><p>You need an internet connection to load the game.</p>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.lancehayes.lifechoices","appName":"Life Choices","webDir":"www","server":{"url":"https://lhayes037-cloud.github.io/life-choices/","cleartext":false}}
          JSON
          npx cap add android >/dev/null
          npx cap sync android >/dev/null
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          if 'RECORD_AUDIO' not in t:
              t = t.replace('</manifest>', '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n</manifest>')
          open(p, 'w').write(t)
          PY
      - name: Use the Life Choices icon
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          src = Image.open('icon-1024.png').convert('RGBA')
          res = 'shell/android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          for d, s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = f'{res}/mipmap-{d}'
              im = src.resize((s, s), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  out = im
                  if name == 'ic_launcher_round.png':
                      mask = Image.new('L', (s, s), 0)
                      ImageDraw.Draw(mask).ellipse([0, 0, s-1, s-1], fill=255)
                      out = Image.new('RGBA', (s, s), (0, 0, 0, 0)); out.paste(im, (0, 0), mask)
                  out.save(f'{folder}/{name}')
          PY
      - name: Build debug APK
        run: |
          cd shell/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp shell/android/app/build/outputs/apk/debug/app-debug.apk life-choices.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest life-choices.apk --title "Life Choices app" --notes "Install this on your Android phone."
